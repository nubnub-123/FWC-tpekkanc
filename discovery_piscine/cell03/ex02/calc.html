<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

<div class="calculator">

    <h1>Calculator</h1>

    <div class="row">
        <input type="text" id="left">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right">
    </div>

    <button onclick="calculate()">
        Try me!
    </button>

</div>

<script src="calc.js"></script>

</body>
</html>
