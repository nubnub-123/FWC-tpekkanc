<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            width: 50%;
            vertical-align: middle;
            padding-left: 10px;
        }

        .left {
            background-color: #c0c97b;
        }

        .right {
            background-color: #e8b9a7;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="left">First cell</td>
            <td class="right">Second cell</td>
        </tr>
    </table>
</body>
</html>
